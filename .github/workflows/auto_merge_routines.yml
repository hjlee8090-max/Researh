name: Auto-merge routine branches

# 스케줄 routine(00/06/09/12/15/18시·주말·audit 등)이 격리 환경에서 작업을
# 세션 브랜치에 push 만 하고 main 에 머지되지 않는 경우를 자동으로 닫아준다.
# routine 커밋을 origin/main 위에 rebase 한 뒤 fast-forward 로 push 하므로,
# 헤드 커밋 메시지(chore(00:00)/report: 등)가 그대로 보존된다.
#
# 단, 이 push 는 기본 GITHUB_TOKEN 으로 이뤄지는데, GitHub 은 GITHUB_TOKEN 이
# 만든 push 이벤트로는 다른 워크플로(build_and_notify.yml)를 트리거하지 않는다
# (무한루프 방지). 따라서 머지 성공 후 build_and_notify 를 workflow_dispatch 로
# 명시 호출한다(dispatch 는 GITHUB_TOKEN recursion 규칙의 예외라 정상 발화).
# 이게 없으면 브랜치 경유 routine(12:00 등)의 카톡 알림·Pages 갱신이 누락된다.

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 1차 필터: routine 커밋 프리픽스일 때만 러너 기동 (build_and_notify.yml 의 알림 분기와 동일 세트)
    if: |
      startsWith(github.event.head_commit.message, 'chore(') ||
      startsWith(github.event.head_commit.message, 'report:') ||
      startsWith(github.event.head_commit.message, 'audit:') ||
      startsWith(github.event.head_commit.message, 'sat-review:') ||
      startsWith(github.event.head_commit.message, 'sun-strategy:') ||
      startsWith(github.event.head_commit.message, 'policy-review:') ||
      startsWith(github.event.head_commit.message, 'weekly:') ||
      startsWith(github.event.head_commit.message, 'weekly-archive:') ||
      startsWith(github.event.head_commit.message, 'data(catalysts):') ||
      startsWith(github.event.head_commit.message, 'data(consensus):') ||
      startsWith(github.event.head_commit.message, 'Merge ')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # 묵은/미검증 가격 체결(price_source 누락 booking)이 main 에 병합되는 것을 하드 차단한다.
      # 위반 시 이 스텝이 비정상 종료 → 이후 rebase/merge 스텝이 실행되지 않아 routine 커밋은
      # 세션 브랜치에 격리된다(policy.price_data_quality.trade_provenance_gate).
      - name: Trade provenance gate (block stale/unverified bookings from reaching main)
        run: python3 scripts/check_trade_log_gate.py

      - name: Verify committer is the routine bot
        id: guard
        env:
          COMMITTER_EMAIL: ${{ github.event.head_commit.committer.email }}
        run: |
          # routine 봇 커밋만 자동 머지 (사람의 WIP 브랜치 오머지 방지)
          case "$COMMITTER_EMAIL" in
            hjlee8090@gmail.com|*kospi-autoflow-bot*|*github-actions*|*users.noreply.github.com)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "non-bot committer ($COMMITTER_EMAIL) — skip auto-merge"
              echo "ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # head 가 merge 커밋인 push 는 1차 필터를 'Merge ' 로 통과시킨 뒤, 여기서 push 안에
      # routine 프리픽스 커밋(제목줄 앵커)이 실제로 있는지 확인한다 (Phase 2-4, 진단 P6:
      # routine 커밋 위에 merge 커밋이 얹히면 head 불일치로 산출물이 브랜치에 무음 고립되던 결합).
      # contains(join(commits)) 방식은 커밋 본문의 우연한 문자열에 오발동하므로 쓰지 않는다.
      - name: Verify push contains routine commits (merge-head fallback)
        id: routine_check
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MSG" in
            Merge\ *)
              git fetch origin main --quiet || true
              if git log --format=%s origin/main..HEAD | \
                 grep -qE '^(chore\(|report:|audit:|sat-review:|sun-strategy:|policy-review:|weekly:|weekly-archive:|data\(catalysts\):|data\(consensus\):)'; then
                echo "ok=true" >> "$GITHUB_OUTPUT"
              else
                echo "merge-head push without routine commits — skip"
                echo "ok=false" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Rebase routine commits onto main and fast-forward push
        if: steps.guard.outputs.ok == 'true' && steps.routine_check.outputs.ok == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kospi-autoflow-bot"
          git config user.email "hjlee8090@gmail.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B routine_work "$SOURCE_SHA"
            # 이미 main 에 포함됐으면(중복 발화) rebase 는 no-op → push 도 up-to-date
            if ! git rebase origin/main; then
              echo "::error::rebase conflict on $SOURCE_REF — leaving branch for manual review"
              git rebase --abort || true
              # 충돌을 커밋된 마커로 표면화 — 일일 감사가 WARN 으로 승격한다 (Phase 2-4, 진단 P6:
              # 이전엔 실패가 '아무 일도 안 일어남'이라 감지 장치가 없었다).
              git checkout -B conflict_marker origin/main
              printf '{"ts":"%s","branch":"%s","reason":"auto_merge rebase conflict"}\n' \
                "$(date -u +%FT%TZ)" "$SOURCE_REF" >> state/merge_conflicts.jsonl
              git add state/merge_conflicts.jsonl
              git commit -m "data(merge): conflict marker $SOURCE_REF"
              git push origin conflict_marker:main || echo "::warning::conflict marker push failed"
              exit 1
            fi
            # 이미 main 에 포함된 커밋이면(중복 발화·재실행) push 는 no-op → dispatch 도 생략해 중복 알림 방지.
            if [ "$(git rev-parse routine_work)" = "$(git rev-parse origin/main)" ]; then
              echo "already merged into main — skip merge & dispatch"
              exit 0
            fi
            # dispatch 용 커밋 메시지 — head 가 merge 커밋이어도 routine 제목을 보존해
            # 카톡 슬롯 식별이 살아있게 한다 (push 후에는 range 가 비므로 push 전에 계산).
            ROUTINE_MSG=$(git log --format=%s origin/main..routine_work | \
              grep -m1 -E '^(chore\(|report:|audit:|sat-review:|sun-strategy:|policy-review:|weekly:|weekly-archive:)' || true)
            if git push origin routine_work:main; then
              MSG_FIRST="${ROUTINE_MSG:-${HEAD_MSG%%$'\n'*}}"
              echo "auto-merged $SOURCE_REF -> main (head: $MSG_FIRST)"
              # GITHUB_TOKEN push 는 build_and_notify 를 트리거하지 않으므로 명시 dispatch.
              gh workflow run build_and_notify.yml --ref main -f commit_message="$MSG_FIRST" \
                && echo "dispatched build_and_notify (commit_message=$MSG_FIRST)" \
                || echo "::warning::failed to dispatch build_and_notify — 알림 누락 가능"
              exit 0
            fi
            echo "push race on main, retry $i"
            sleep $((2 ** i))
          done
          echo "::error::exhausted retries pushing $SOURCE_REF -> main"
          exit 1
