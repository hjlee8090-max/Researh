name: Fetch Prices & Score Candidates

# 차단된 웹 세션 대신, 인터넷이 되는 GitHub Actions 러너에서 시세를 수집한다.
# fetch_market_data.py + score_candidates.py 를 실행해 state/*.json 을 커밋하고,
# 웹 세션 routine 은 커밋된 스냅샷을 1순위 출처로 읽는다.

on:
  # ── 1순위(주 트리거): 외부 스케줄러(cron-job.org 등)가 routine 5분 전 정시에
  #    아래 API 로 workflow_dispatch 를 호출한다. GitHub schedule 과 달리 dispatch 는
  #    큐 지연이 없어 호출 수 초 내 시작된다 → 스냅샷 age 가 ~5분(fresh ≤20분)으로
  #    들어와 routine 의 웹 교차확인(live_verify) 부담이 사라진다.
  #      호출: POST https://api.github.com/repos/hjlee8090-max/Researh/actions/workflows/fetch_prices.yml/dispatches
  #      헤더: Authorization: Bearer <PAT(Actions:RW)> · Accept: application/vnd.github+json · X-GitHub-Api-Version: 2022-11-28
  #      본문: {"ref":"main"}    시각(Asia/Seoul, 평일): 08:55 / 11:55 / 14:55 / 17:55
  #    설정 안내: docs/price_fetch_trigger.md
  workflow_dispatch:

  # ── 백업(안전망): 외부 트리거가 멈췄을 때만 의미가 있다. GitHub schedule 은
  #    정시 보장이 없어 30~50분+ 지연·누락된다(공식 문서: high load·매시 정각 지연.
  #    관측: UTC 03:00→03:32 / 06:00→06:53 / 09:00→09:40). 그래서 신선도는 1순위
  #    dispatch 에 맡기고, schedule 은 routine 약 1시간 전(:05, 정각 회피) 1겹만 남겨
  #    '외부 트리거 실패 시에도 늦어도 routine 전에는 뭐라도 들어오게' 하는 보루로 쓴다.
  #    UTC 23:05(일~목)=KST 08:05 → 09시 / UTC 02:05·05:05·08:05(월~금)=KST 11·14·17시 → 12·15·18시
  #
  #    ── 개장 직후 보강(09시 전용): 위 08:05 백업·외부 08:55 dispatch 는 모두 '개장(09:00) 전'
  #    이라 당일 시세가 아직 없어 전일 종가밖에 못 담는다(today_ohlc=null). 그 탓에 09시
  #    '개장 점검' 리포트가 매일 당일 시가를 못 받고 '출처 차단(403)·미확인'으로 떨어지는
  #    구멍이 있었다(12·15·18시는 11:55·14:55·17:55 수집이 장중이라 정상). 이를 메우려
  #    '개장 직후' 한 겹을 더 둔다: UTC 00:05(월~금)=KST 09:05 → 09시 (장 시작 5분 뒤라
  #    시초가 반영분 확보). 단 schedule 지연이 있으므로 정시성은 외부 09:07 dispatch(1순위)에
  #    맡기고, 이 cron 은 '외부 트리거가 멈춘 날에도 개장 직후 스냅샷이 한 번은 들어오게'
  #    하는 보루다.
  schedule:
    - cron: "5 23 * * 0-4"
    - cron: "5 0 * * 1-5"
    - cron: "5 2,5,8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps (krx EOD backstop)
        run: pip install --quiet pykrx || true
      - name: Fetch market data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/fetch_market_data.py
      - name: Score candidates
        run: python scripts/score_candidates.py
      - name: Estimate target prices
        run: python scripts/estimate_target_price.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/market_snapshot.json state/candidate_scores.json state/target_estimate.json state/target_estimate_log.jsonl
          if git diff --cached --quiet; then
            echo "no snapshot changes — skip commit"
          else
            git commit -m "data(prices): scheduled market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
