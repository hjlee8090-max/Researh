name: Pipeline Audit Report

on:
  schedule:
    # 19:30 KST, 매일 — 주말 실행이 주말 산출물(사후분석·전략·정책리뷰·주간 아카이브)과
    # 슬롯 매트릭스를 감시한다. 평일 한정이던 시절 주간 아카이브 3주 미발화(W24~W26)를
    # 아무도 감지하지 못했다 (docs/plan_hourly_report_gap_fix.md Phase 1-2).
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet markdown
      - name: Rule attribution
        run: python scripts/rule_attribution.py || true
      - name: Write audit report
        run: python scripts/write_audit_report.py || true
      - name: Commit audit report
        id: commit
        run: |
          git config user.name "kospi-autoflow-bot"
          git config user.email "hjlee8090@gmail.com"
          git add reports/ state/audit_log.jsonl state/rule_attribution.json state/exit_tracking.json config/weekly_plan.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            echo "message=audit: $(date -u +%Y-%m-%d) pipeline health report" >> "$GITHUB_OUTPUT"
          else
            MSG="audit: $(date -u +%Y-%m-%d) pipeline health report"
            git commit -m "$MSG"
            git push
            echo "message=$MSG" >> "$GITHUB_OUTPUT"
          fi
      - name: Build HTML
        run: python scripts/build_html.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Send Kakao notification
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: python scripts/send_kakao.py
