name: Fetch Price History (backtest)

# 백테스트용 장기 일봉(~2.5년)을 인터넷 되는 러너에서 수집해 커밋한다.
# 목표주가 추정식 백테스트(backtest_target_model.py) + momentum_signal 의 1순위 입력.

on:
  workflow_dispatch:
  # 세션 브랜치에서 dispatch 권한 없이도 돌릴 수 있게 push 트리거 병행.
  # 트리거 파일(state/.history_request)을 갱신해 푸시하면 1회 수집된다.
  push:
    paths:
      - "state/.history_request"
      - "scripts/fetch_history.py"
  # 매 거래일 마감 후 자동 갱신 — price_history(모멘텀 1순위 입력)의 staleness 방지.
  # fetch_prices(23:05 UTC) 이후로 두어 당일 종가가 반영된 뒤 수집한다.
  # cron 23:30 UTC(0-4=일~목) = KST 월~금 08:30. momentum_signal 의 snapshot overlay 는 이제 안전망.
  # (2026-08-11 P1-a) 21:10 UTC(일~목) = KST 화~토 06:10 추가 — 미국장 마감(EDT 05:00 KST)
  # 직후 해외 심볼(MU·^SOX 포함) 야간 확정치를 06:30 슬롯이 읽을 수 있게 한다.
  # 겨울(EST) 마감은 06:00 KST 라 06:10 수집분이 마감 직후 확정치 — 06:30 슬롯이 §1 에서
  # last bar 날짜·정합을 교차확인한다(reports/2026-08-10-lessons-loop-data-gap-review.md 갭 #2).
  schedule:
    - cron: "30 23 * * 0-4"
    - cron: "10 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: fetch-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch long price history
        run: python scripts/fetch_history.py
      - name: Backtest strategy + regenerate momentum signal
        run: |
          python scripts/backtest_strategy.py || echo "backtest skipped (data insufficient)"
          python scripts/momentum_signal.py || echo "signal skipped (data insufficient)"
      - name: Commit history if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/price_history.json state/backtest_strategy.json state/momentum_signal.json
          if git diff --cached --quiet; then
            echo "no history changes — skip commit"
          else
            git commit -m "data(history): backtest price history + momentum signal $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
