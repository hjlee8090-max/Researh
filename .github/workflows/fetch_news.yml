name: Fetch News (keyword classify)

# 종목 뉴스를 인터넷 되는 러너에서 수집해 키워드 분류 후 커밋한다.
# 목표주가 추정식(estimate_target_price v1.2)의 뉴스 가산점 자동 입력.
# 키워드 레지스트리: config/news_keywords.json (news_impact 가산점 테이블과 1:1).

on:
  schedule:
    # 평일 07:30 KST(개장 전, 22:30 UTC 전일) + 14:30 KST(05:30 UTC, 15시 마감 임박 점검 전)
    # + 17:40 KST(마감 후, 08:40 UTC) — 09/15/18시 routine 전
    - cron: "30 22 * * 0-4"
    - cron: "30 5 * * 1-5"
    - cron: "40 8 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "state/.news_request"
      - "scripts/fetch_news.py"
      - "config/news_keywords.json"

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch & classify news
        run: python scripts/fetch_news.py
      - name: Commit news feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_feed.json
          if git diff --cached --quiet; then
            echo "no news changes — skip commit"
          else
            git commit -m "data(news): keyword-classified news feed $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
