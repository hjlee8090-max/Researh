name: Pipeline Audit Report

on:
  schedule:
    # 19:30 KST, 매일 — 주말 실행이 주말 산출물(사후분석·전략·정책리뷰·주간 아카이브)과
    # 슬롯 매트릭스를 감시한다. 평일 한정이던 시절 주간 아카이브 3주 미발화(W24~W26)를
    # 아무도 감지하지 못했다 (docs/plan_hourly_report_gap_fix.md Phase 1-2).
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 교훈 반영 강제 게이트 (2026-07-06 감사 처방⑤) — check_lessons_applied 는 그동안
  # audit_pipeline 안에서 어드바이저리(WARN)로만 돌아 hard 미반영 교훈이 4주씩 방치됐다
  # (예: 금요일 ORANGE 사전청산 룰). 별도 job 으로 LESSONS_ENFORCE=1 을 걸어 hard 미반영이
  # 있으면 워크플로를 FAIL 시킨다. audit job 과 분리한 이유: 게이트 실패가 일일 감사
  # 리포트·카톡 발송(모니터링 경로)까지 죽이면 안 되기 때문.
  lessons-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Enforce lessons applied (hard markers block)
        env:
          LESSONS_ENFORCE: "1"
        run: python scripts/check_lessons_applied.py

  audit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet markdown
      - name: Rule attribution
        run: python scripts/rule_attribution.py || true
      - name: Render trade cards
        run: python scripts/render_trade_cards.py || true
      # || true 금지 — 감사 크래시가 초록 런으로 위장되던 구멍. 리포트 커밋·발송은
      # continue-on-error 로 계속 진행하되, 마지막 step 이 outcome 을 보고 런을 빨갛게 만든다.
      - name: Write audit report
        id: audit
        continue-on-error: true
        run: python scripts/write_audit_report.py
      - name: Commit audit report
        id: commit
        run: |
          git config user.name "kospi-autoflow-bot"
          git config user.email "hjlee8090@gmail.com"
          git add reports/ state/audit_log.jsonl state/rule_attribution.json state/exit_tracking.json state/trade_cards.md state/context_budget_state.json config/weekly_plan.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            echo "message=audit: $(date -u +%Y-%m-%d) pipeline health report" >> "$GITHUB_OUTPUT"
          else
            MSG="audit: $(date -u +%Y-%m-%d) pipeline health report"
            git commit -m "$MSG"
            git push
            echo "message=$MSG" >> "$GITHUB_OUTPUT"
          fi
      - name: Build HTML
        run: python scripts/build_html.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Send Kakao notification
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: python scripts/send_kakao.py
      # 발송 이력 원장 커밋 (Phase 1-3) — 감사 자신의 발송도 대사 대상이다.
      - name: Commit notify ledger
        if: always()
        run: |
          git config user.name "kospi-autoflow-bot"
          git config user.email "hjlee8090@gmail.com"
          git add state/notify_log.jsonl
          if git diff --cached --quiet; then
            echo "no ledger changes"
            exit 0
          fi
          git commit -m "data(notify): delivery ledger $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || true
          done
          git push
      # 감사 스크립트가 FAIL/ERROR(비정상 종료 포함)였으면 리포트·발송을 마친 뒤 런을 실패로 표시
      - name: Fail run if audit failed
        if: always() && steps.audit.outcome != 'success'
        run: |
          echo "::error::write_audit_report.py 가 실패(FAIL 또는 ERROR) — reports/ 의 오늘자 audit 리포트 확인 필요"
          exit 1
