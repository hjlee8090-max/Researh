name: Fetch Catalysts (DART + 법정기한)

# 촉매 캘린더 레이어 — 인터넷이 되는 GitHub Actions 러너에서 종목별 다가오는 촉매를 추정한다.
# fetch_catalysts.py 가 config/catalysts.json 의 generated_events(법정 제출기한 추정)를 갱신하고,
# 웹 세션 routine 은 이를 읽어 D-day 경보·신규 진입 보류 판단에 쓴다. manual_events 는 보존된다.
#
# 전제: 레포 Secret 에 DART_API_KEY 가 있으면 최근 제출분으로 다음 회차를 보정한다.
#       키가 없어도 법정기한 백본은 생성되며 실패하지 않는다(graceful degrade).
# 정기보고서 일정은 분기 단위라 주 1회(일요일, 전략 routine 전)면 충분하다.

on:
  schedule:
    # 매주 일요일 06:30 KST = 토요일 21:30 UTC. fetch_fundamentals(22:00 UTC)·일요일 전략 전에 갱신.
    - cron: "30 21 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-catalysts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch catalysts (DART + statutory deadlines)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_catalysts.py
      - name: Commit catalysts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/catalysts.json
          if git diff --cached --quiet; then
            echo "no catalysts changes — skip commit"
          else
            git commit -m "data(catalysts): scheduled catalyst calendar refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
