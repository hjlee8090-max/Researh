name: Fetch Prices & Score Candidates

# 차단된 웹 세션 대신, 인터넷이 되는 GitHub Actions 러너에서 시세를 수집한다.
# fetch_market_data.py + score_candidates.py 를 실행해 state/*.json 을 커밋하고,
# 웹 세션 routine 은 커밋된 스냅샷을 1순위 출처로 읽는다.

on:
  schedule:
    # v2.0 — routine 1시간 전부터 미리 수집해 신선한 스냅샷을 커밋한다.
    #   ★ 지연의 근본 원인: GitHub Actions schedule 은 정시 보장이 없고, 특히 매 정각(분=00)
    #     에 전 세계 워크플로가 몰려 큐가 밀린다(공식 문서: "delayed during high loads,
    #     including the start of every hour"). 우리 cron 이 전부 정각이라 30~50분+ 지연을
    #     정통으로 맞았다(관측: UTC 03:00→03:32=KST 12:32 / 06:00→06:53=15:53 / 09:00→09:40=18:40).
    #   대응: (1) 더 일찍(1시간 전) 당기고 (2) 정각을 피한 분(:05/:30)으로 잡아 큐 혼잡 자체를 회피.
    #     1시간 전·30분 전·동시각 3중이라 어떤 지연 패턴에도 routine 전에 신선본이 들어온다.
    #     (데이터 변동이 없으면 스크립트가 커밋을 skip 하므로 중복 커밋 노이즈는 없다.)
    # 1시간 전(정각 회피 :05) — KST 08:05 / 11:05 / 14:05 / 17:05
    - cron: "5 23 * * 0-4"
    - cron: "5 2,5,8 * * 1-5"
    # 30분 전(:30) — KST 08:30 / 11:30 / 14:30 / 17:30
    - cron: "30 23 * * 0-4"
    - cron: "30 2,5,8 * * 1-5"
    # 동시각 백업 — KST 09/12/15/18 (앞선 둘이 모두 크게 지연될 때 최후 보루)
    - cron: "0 0,3,6,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Score candidates
        run: python scripts/score_candidates.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/market_snapshot.json state/candidate_scores.json
          if git diff --cached --quiet; then
            echo "no snapshot changes — skip commit"
          else
            git commit -m "data(prices): scheduled market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
