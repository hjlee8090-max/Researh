name: Build HTML & Kakao Notify

on:
  push:
    branches: [main, master]
    paths:
      - "reports/**"
      - "config/**"
      - "prompts/**"
      - "state/audit_log.jsonl"
      - "state/lessons.md"
      - "state/trade_log.jsonl"
      - "templates/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/build_and_notify.yml"
      - ".github/workflows/pipeline_audit.yml"
  workflow_dispatch:
    inputs:
      commit_message:
        description: "routine 커밋 메시지(슬롯 식별용). auto_merge 가 GITHUB_TOKEN push 후 전달한다."
        required: false
        default: ""

permissions:
  # notify job 이 발송 이력 원장(state/notify_log.jsonl)을 커밋한다 (Phase 1-3).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet markdown
      - name: Audit pipeline
        run: python scripts/audit_pipeline.py
      - name: Build HTML
        run: python scripts/build_html.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    # 09/12/15 (chore:) 및 18시 (report:) 커밋, 그리고 수동 트리거에서 카톡 발송.
    if: |
      startsWith(github.event.head_commit.message, 'report:') ||
      startsWith(github.event.head_commit.message, 'weekly:') ||
      startsWith(github.event.head_commit.message, 'weekly-archive:') ||
      startsWith(github.event.head_commit.message, 'audit:') ||
      startsWith(github.event.head_commit.message, 'sat-review:') ||
      startsWith(github.event.head_commit.message, 'sun-strategy:') ||
      startsWith(github.event.head_commit.message, 'policy-review:') ||
      startsWith(github.event.head_commit.message, 'chore(') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # push 가 실제로 변경한 파일 목록 — send_kakao 가 "리포트 파일을 바꾼 push"만 알림 발송
      # (같은 routine 의 후속 잡무 커밋이 같은 슬롯 알림을 중복 발송하던 문제 방지, 2026-06-12).
      - name: Compute changed files (push only)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed_files.txt || : > /tmp/changed_files.txt
          else
            git show --name-only --format= "$AFTER" > /tmp/changed_files.txt || : > /tmp/changed_files.txt
          fi
          echo "changed files: $(wc -l < /tmp/changed_files.txt)"
      - name: Send Kakao notification
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          # push 트리거면 head_commit.message, auto_merge 가 dispatch 한 경우 inputs.commit_message 사용.
          COMMIT_MESSAGE: ${{ github.event.inputs.commit_message || github.event.head_commit.message }}
          CHANGED_FILES_FILE: ${{ github.event_name == 'push' && '/tmp/changed_files.txt' || '' }}
        run: python scripts/send_kakao.py
      # 발송 이력 원장 커밋 — 감사가 "어제 발송이 실제로 나갔는지" 대사한다 (Phase 1-3).
      # notify_log 는 build_and_notify 의 paths 필터에 없어 이 push 가 재트리거를 만들지 않는다.
      # if: always() — 발송이 실패(exit 1)해도 실패 기록은 커밋되어야 감사가 본다.
      - name: Commit notify ledger
        if: always()
        run: |
          git config user.name "kospi-autoflow-bot"
          git config user.email "hjlee8090@gmail.com"
          git add state/notify_log.jsonl
          if git diff --cached --quiet; then
            echo "no ledger changes"
            exit 0
          fi
          git commit -m "data(notify): delivery ledger $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || true
          done
          git push
