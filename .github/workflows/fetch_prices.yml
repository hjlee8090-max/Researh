name: Fetch Prices & Score Candidates

# 차단된 웹 세션 대신, 인터넷이 되는 GitHub Actions 러너에서 시세를 수집한다.
# fetch_market_data.py + score_candidates.py 를 실행해 state/*.json 을 커밋하고,
# 웹 세션 routine 은 커밋된 스냅샷을 1순위 출처로 읽는다.

on:
  schedule:
    # v2.0 — routine 10분 전에 미리 수집해 '신선한' 스냅샷을 커밋한다.
    #   직전까지는 routine 과 동시각(KST 09/12/15/18)에만 수집해, 웹 세션 routine 이
    #   Actions 보다 먼저 돌면 스냅샷이 stale→신규 진입이 medium 으로 막히곤 했다.
    # KST 08:50 월~금 = UTC 23:50 일~목 (09시 routine 10분 전)
    - cron: "50 23 * * 0-4"
    # KST 11:50/14:50/17:50 월~금 = UTC 02:50/05:50/08:50 월~금 (12/15/18시 routine 10분 전)
    - cron: "50 2,5,8 * * 1-5"
    # 백업 — routine 동시각(KST 09/12/15/18 = UTC 00/03/06/09). schedule 은 기본 브랜치에서만 실행됨.
    - cron: "0 0,3,6,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Score candidates
        run: python scripts/score_candidates.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/market_snapshot.json state/candidate_scores.json
          if git diff --cached --quiet; then
            echo "no snapshot changes — skip commit"
          else
            git commit -m "data(prices): scheduled market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
